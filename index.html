<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  color: #1e293b; background: #f8fafc; line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
img { max-width: 100%; display: block; }

.header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #e2e8f0; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; }
.brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 1.125rem; color: #0f172a; }
.brand-icon { font-size: 1.5rem; }
.nav { display: flex; gap: 1.5rem; }
.nav a { color: #475569; font-weight: 500; font-size: .9375rem; transition: color .2s; }
.nav a:hover, .nav a.active { color: #0ea5e9; }

.page { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: .5rem; color: #0f172a; }
.page-subtitle { color: #64748b; margin-bottom: 2rem; }

.hero { background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%); color: #fff; padding: 5rem 1.5rem; }
.hero-inner { max-width: 900px; margin: 0 auto; text-align: center; }
.hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.2; }
.hero p { font-size: 1.125rem; opacity: .95; margin-bottom: 2rem; }
.hero-cta { display: inline-flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
.btn-primary { background: #fff; color: #0369a1; padding: .75rem 1.5rem; border-radius: .5rem; font-weight: 600; border: none; transition: transform .15s; }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.6); padding: .75rem 1.5rem; border-radius: .5rem; font-weight: 600; }
.btn-ghost:hover { background: rgba(255,255,255,.15); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 3rem 0; }
.stat-card { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.5rem; }
.stat-label { color: #64748b; font-size: .875rem; margin-bottom: .5rem; }
.stat-value { font-size: 2rem; font-weight: 700; color: #0f172a; }
.stat-value.accent { color: #0ea5e9; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 3rem 0 1.25rem; }
.section-head h2 { font-size: 1.375rem; font-weight: 700; color: #0f172a; }
.section-head a { color: #0ea5e9; font-size: .9375rem; font-weight: 500; }

.filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.filter-btn { padding: .5rem 1rem; border: 1px solid #e2e8f0; border-radius: 999px; background: #fff; color: #475569; font-size: .875rem; font-weight: 500; transition: all .15s; }
.filter-btn:hover { border-color: #0ea5e9; color: #0ea5e9; }
.filter-btn.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; overflow: hidden; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; cursor: pointer; }
.card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -12px rgba(0,0,0,.15); }
.card-img { width: 100%; height: 180px; object-fit: cover; background: #f1f5f9; }
.card-img-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg, #e0f2fe, #bae6fd); display: flex; align-items: center; justify-content: center; color: #0369a1; font-size: 2.5rem; }
.card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; gap: .5rem; }
.card-title { font-size: 1.125rem; font-weight: 700; color: #0f172a; }
.card-meta { font-size: .8125rem; color: #64748b; }
.card-progress { margin-top: auto; padding-top: .75rem; }

.badge { display: inline-block; padding: .25rem .625rem; border-radius: .375rem; font-size: .75rem; font-weight: 600; }
.badge-pred { background: #fef3c7; color: #92400e; }
.badge-prog { background: #dbeafe; color: #1e40af; }
.badge-done { background: #d1fae5; color: #065f46; }

.progress-wrap { display: flex; align-items: center; gap: .75rem; }
.progress-track { flex: 1; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #06b6d4); border-radius: 999px; transition: width .4s; }
.progress-num { font-size: .875rem; font-weight: 600; color: #0f172a; min-width: 36px; text-align: right; }

.detail-hero { position: relative; height: 320px; border-radius: 1rem; overflow: hidden; margin-bottom: 1.5rem; background: #e2e8f0; }
.detail-hero img { width: 100%; height: 100%; object-fit: cover; }
.detail-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), transparent); display: flex; align-items: flex-end; padding: 2rem; }
.detail-hero-title { color: #fff; }
.detail-hero-title h1 { font-size: 2rem; font-weight: 800; margin-bottom: .5rem; }
.detail-hero-title p { opacity: .9; }

.detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-top: 2rem; }
@media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }

.info-card { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
.info-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: #0f172a; }
.info-card .mt-1 { margin-top: 1rem; }
.info-card p { color: #64748b; font-size: .875rem; margin-bottom: 1rem; }
.info-row { display: flex; justify-content: space-between; padding: .625rem 0; border-bottom: 1px solid #f1f5f9; font-size: .9375rem; }
.info-row:last-child { border-bottom: none; }
.info-label { color: #64748b; }
.info-value { color: #0f172a; font-weight: 500; }

.issue-item { display: flex; gap: 1rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: .5rem; margin-bottom: .75rem; background: #fff; }
.issue-priority { width: 4px; border-radius: 2px; flex-shrink: 0; }
.priority-high { background: #ef4444; }
.priority-mid { background: #f59e0b; }
.priority-low { background: #94a3b8; }
.issue-body { flex: 1; }
.issue-name { font-weight: 600; color: #0f172a; margin-bottom: .25rem; }
.issue-meta { display: flex; gap: .75rem; font-size: .8125rem; color: #64748b; margin-bottom: .375rem; flex-wrap: wrap; }
.issue-content { font-size: .875rem; color: #475569; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; margin-top: 1rem; }
.gallery img { aspect-ratio: 1; object-fit: cover; border-radius: .5rem; cursor: pointer; transition: transform .15s; }
.gallery img:hover { transform: scale(1.03); }

.form { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 2rem; max-width: 720px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
@media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
.form-field { display: flex; flex-direction: column; gap: .375rem; margin-bottom: 1.25rem; }
.form-row .form-field { margin-bottom: 0; }
.form-label { font-size: .875rem; font-weight: 600; color: #334155; }
.form-label .required { color: #ef4444; margin-left: .125rem; }
.form-input, .form-select, .form-textarea { padding: .625rem .875rem; border: 1px solid #cbd5e1; border-radius: .5rem; font-size: .9375rem; font-family: inherit; background: #fff; transition: border .15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.1); }
.form-textarea { resize: vertical; min-height: 120px; }
.form-help { color: #94a3b8; font-size: .75rem; }
.form-submit { background: #0ea5e9; color: #fff; padding: .875rem 2rem; border: none; border-radius: .5rem; font-size: 1rem; font-weight: 600; transition: background .15s; }
.form-submit:hover { background: #0284c7; }
.form-submit:disabled { background: #94a3b8; cursor: not-allowed; }
.form-success { background: #d1fae5; color: #065f46; padding: 1rem; border-radius: .5rem; margin-bottom: 1rem; }
.form-error { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: .5rem; margin-bottom: 1rem; }

.state-msg { text-align: center; padding: 4rem 1rem; color: #64748b; }
.state-msg.error { color: #ef4444; }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #0ea5e9; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }

.footer { background: #0f172a; color: #cbd5e1; padding: 2.5rem 1.5rem; margin-top: 4rem; text-align: center; font-size: .875rem; }
.footer p { margin-top: .5rem; opacity: .7; }
</style>

nction parseProject(page) {\n  const p = page.properties || {};\n  const gallery = getFiles(p['사진갤러리']);\n  const cover = getFiles(p['대표사진'])[0] || gallery[0] || '';\n  return {\n    id: page.id,\n    name: getValue(p['현장명']) || '제목 없음',\n    status: getValue(p['상태']) || '예정',\n    address: getValue(p['주소']),\n    progress: Number(getValue(p['공정률'])) || 0,\n    startDate: getValue(p['착공일']),\n    endDate: getValue(p['준공예정일']),\n    cover,\n    gallery,\n    manager: getValue(p['담당소장']),\n    managerPhone: getValue(p['담당자연락처']),\n    scale: getValue(p['시공규모']),\n  };\n}\n\nfunction parseIssue(page) {\n  const p = page.properties || {};\n  const rel = p['현장'] && p['현장'].relation && p['현장'].relation[0];\n  return {\n    id: page.id,\n    name: getValue(p['이슈명']) || '제목 없음',\n    projectId: rel ? rel.id : '',\n    priority: getValue(p['우선순위']) || '중간',\n    status: getValue(p['상태']) || '열림',\n    date: getValue(p['등록일']),\n    content: getValue(p['내용']),\n  };\n}\n\n// =================== Fallback 데이터 ===================\nconst FALLBACK_PROJECTS = [\n  {\n    id: 'sample-1', name: '강남 오피스텔 신축', status: '진행중',\n    address: '서울 강남구 역삼로 123', progress: 65,\n    startDate: '2025-08-01', endDate: '2026-09-30',\n    cover: 'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=1200',\n    gallery: [\n      'https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=1200',\n      'https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=1200',\n      'https://images.unsplash.com/photo-1486325212027-8081e485255e?w=1200',\n    ],\n    manager: '김현장', managerPhone: '010-1234-5678', scale: '지상 12층 / 지하 3층',\n  },\n  {\n    id: 'sample-2', name: '판교 단독주택 건축', status: '예정',\n    address: '경기 성남시 분당구 판교로 45', progress: 0,\n    startDate: '2026-06-01', endDate: '2027-03-31',\n    cover: 'https://images.unsplash.com/photo-1572120360610-d971b9d7767c?w=1200',\n    gallery: [],\n    manager: '이공무', managerPhone: '', scale: '지상 2층',\n  },\n  {\n    id: 'sample-3', name: '탄벌동 빌라 리모델링', status: '완료',\n    address: '경기 광주시 탄벌동 78-3', progress: 100,\n    startDate: '2024-03-01', endDate: '2025-01-15',\n    cover: 'https://images.unsplash.com/photo-1448630360428-65456885c650?w=1200',\n    gallery: ['https://images.unsplash.com/photo-1448630360428-65456885c650?w=1200'],\n    manager: '박소장', managerPhone: '010-9876-5432', scale: '지상 4층',\n  },\n];\n\nconst FALLBACK_ISSUES = [\n  { id: 'i1', name: '3층 누수 발생', projectId: 'sample-1', priority: '높음', status: '처리중', date: '2026-04-20', content: '비온 후 천장 모서리에서 물이 떨어짐. 방수 재작업 필요.' },\n  { id: 'i2', name: '엘리베이터 설치 일정 조율', projectId: 'sample-1', priority: '중간', status: '열림', date: '2026-04-22', content: '협력사 일정 확인 후 골조 일정과 매칭 필요.' },\n  { id: 'i3', name: '외장재 색상 변경 요청', projectId: 'sample-1', priority: '낮음', status: '해결', date: '2026-04-10', content: '건축주 요청 반영 완료. 발주 변경 처리됨.' },\n];\n\n// =================== API 호출 ===================\nasync function fetchProjects() {\n  try {\n    const res = await fetch('/api/notion/databases/' + PROJECTS_DB_ID + '/query', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page_size: 100 }),\n    });\n    const data = await res.json();\n    if (data && data.results && data.results.length) return data.results.map(parseProject);\n  } catch (e) { /* fallback */ }\n  return FALLBACK_PROJECTS;\n}\n\nasync function fetchIssuesByProject(projectId) {\n  try {\n    const res = await fetch('/api/notion/databases/' + ISSUES_DB_ID + '/query', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page_size: 100 }),\n    });\n    const data = await res.json();\n    if (data && data.results && data.results.length) {\n      return data.results.map(parseIssue).filter(i => i.projectId === projectId);\n    }\n  } catch (e) { /* fallback */ }\n  return FALLBACK_ISSUES.filter(i => i.projectId === projectId);\n}\n\nasync function submitInquiry(form) {\n  const properties = {\n    '이름': { title: [{ text: { content: form.name || '' } }] },\n    '이메일': { email: form.email || null },\n    '전화번호': { phone_number: form.phone || null },\n    '관계': { select: form.relation ? { name: form.relation } : null },\n    '문의 유형': { select: form.type ? { name: form.type } : null },\n    '관련 현장': { relation: form.projectId ? [{ id: form.projectId }] : [] },\n    '동·호수': { rich_text: [{ text: { content: form.unit || '' } }] },\n    '발생일': form.occurredAt ? { date: { start: form.occurredAt } } : { date: null },\n    '긴급도': { select: form.urgency ? { name: form.urgency } : null },\n    '문의 내용': { rich_text: [{ text: { content: form.content || '' } }] },\n  };\n  const res = await fetch('/api/notion/pages', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ parent: { database_id: INQUIRIES_DB_ID }, properties }),\n  });\n  if (!res.ok) throw new Error('접수에 실패했습니다. 잠시 후 다시 시도해주세요.');\n  return await res.json();\n}\n\n// =================== 공용 UI ===================\nfunction Header(props) {\n  const items = [\n    { key: 'home', label: '홈' },\n    { key: 'projects', label: '현장 목록' },\n    { key: 'contact', label: '문의·하자접수' },\n    { key: 'about', label: '회사 소개' },\n  ];\n  const isActive = (key) => props.active === key || (key === 'projects' && props.active === 'project-detail');\n  return (\n    <header className=\"header\">\n      <div className=\"header-inner\">\n        <a className=\"brand\" onClick={() => props.onNav('home')}>\n          <span className=\"brand-icon\">🏗️</span>\n          <span>고니x 종합건설</span>\n        </a>\n        <nav className=\"nav\">\n          {items.map(it => (\n            <a key={it.key} className={isActive(it.key) ? 'active' : ''} onClick={() => props.onNav(it.key)}>\n              {it.label}\n            </a>\n          ))}\n        </nav>\n      </div>\n    </header>\n  );\n}\n\nfunction Footer() {\n  return (\n    <footer className=\"footer\">\n      <div>© 2026 고니x 종합건설 · ceo@gonix.co.kr</div>\n      <p>현장 진행상황은 노션 DB와 실시간 연동됩니다.</p>\n    </footer>\n  );\n}\n\nfunction Spinner() {\n  return (\n    <div className=\"state-msg\">\n      <div className=\"spinner\"></div>\n      <div>불러오는 중...</div>\n    </div>\n  );\n}\n\nfunction ProgressBar(props) {\n  const v = Math.max(0, Math.min(100, Number(props.value) || 0));\n  const fillStyle = { width: v + '%' };\n  return (\n    <div className=\"progress-wrap\">\n      <div className=\"progress-track\">\n        <div className=\"progress-fill\" style={fillStyle}></div>\n      </div>\n      <div className=\"progress-num\">{v}%</div>\n    </div>\n  );\n}\n\nfunction StatusBadge(props) {\n  const cls = STATUS_CLASS[props.status] || 'badge-pred';\n  return <span className={'badge ' + cls}>{props.status}</span>;\n}\n\nfunction ProjectCard(props) {\n  const p = props.project;\n  return (\n    <div className=\"card\" onClick={props.onClick}>\n      {p.cover\n        ? <img className=\"card-img\" src={p.cover} alt={p.name} />\n        : <div className=\"card-img-placeholder\">🏗️</div>}\n      <div className=\"card-body\">\n        <div><StatusBadge status={p.status} /></div>\n        <div className=\"card-title\">{p.name}</div>\n        <div className=\"card-meta\">📍 {p.address || '주소 미정'}</div>\n        <div className=\"card-meta\">📐 {p.scale || '규모 미정'}</div>\n        <div className=\"card-meta\">📅 {p.startDate || '?'} ~ {p.endDate || '?'}</div>\n        <div className=\"card-progress\"><ProgressBar value={p.progress} /></div>\n      </div>\n    </div>\n  );\n}\n\n// =================== 홈 뷰 ===================\nfunction HomeView(props) {\n  const projects = props.projects;\n  const ongoing = projects.filter(p => p.status === '진행중');\n  const upcoming = projects.filter(p => p.status === '예정');\n  const done = projects.filter(p => p.status === '완료');\n  const featured = ongoing.slice(0, 3);\n  const avg = ongoing.length\n    ? Math.round(ongoing.reduce((s, p) => s + p.progress, 0) / ongoing.length)\n    : 0;\n\n  return (\n    <>\n      <section className=\"hero\">\n        <div className=\"hero-inner\">\n          <h1>현장 진행상황을<br />언제나 투명하게</h1>\n          <p>고니x 종합건설은 진행 중인 모든 현장을 실시간으로 공유합니다.<br />건축주, 입주예정자, 협력사 누구나 쉽게 확인하세요.</p>\n          <div className=\"hero-cta\">\n            <button className=\"btn-primary\" onClick={() => props.onNav('projects')}>현장 보러가기</button>\n            <button className=\"btn-ghost\" onClick={() => props.onNav('contact')}>문의하기</button>\n          </div>\n        </div>\n      </section>\n\n      <div className=\"page\">\n        <div className=\"stats\">\n          <div className=\"stat-card\"><div className=\"stat-label\">진행 중인 현장</div><div className=\"stat-value accent\">{ongoing.length}</div></div>\n          <div className=\"stat-card\"><div className=\"stat-label\">예정 현장</div><div className=\"stat-value\">{upcoming.length}</div></div>\n          <div className=\"stat-card\"><div className=\"stat-label\">누적 완료</div><div className=\"stat-value\">{done.length}</div></div>\n          <div className=\"stat-card\"><div className=\"stat-label\">평균 공정률</div><div className=\"stat-value accent\">{avg}%</div></div>\n        </div>\n\n        <div className=\"section-head\">\n          <h2>🚧 진행 중인 주요 현장</h2>\n          <a onClick={() => props.onNav('projects')}>전체 보기 →</a>\n        </div>\n\n        {featured.length === 0 ? (\n          <div className=\"state-msg\">진행 중인 현장이 없습니다</div>\n        ) : (\n          <div className=\"grid\">\n            {featured.map(p => <ProjectCard key={p.id} project={p} onClick={() => props.onOpen(p.id)} />)}\n          </div>\n        )}\n      </div>\n    </>\n  );\n}\n\n// =================== 현장 목록 뷰 ===================\nfunction ProjectsView(props) {\n  const [filter, setFilter] = useState('all');\n  const filters = [\n    { key: 'all', label: '전체' },\n    { key: '진행중', label: '진행중' },\n    { key: '예정', label: '예정' },\n    { key: '완료', label: '완료' },\n  ];\n  const filtered = filter === 'all' ? props.projects : props.projects.filter(p => p.status === filter);\n\n  return (\n    <div className=\"page\">\n      <h1 className=\"page-title\">현장 목록</h1>\n      <p className=\"page-subtitle\">총 {props.projects.length}개 현장 중 {filtered.length}개 표시</p>\n\n      <div className=\"filter-bar\">\n        {filters.map(f => (\n          <button key={f.key} className={'filter-btn' + (filter === f.key ? ' active' : '')} onClick={() => setFilter(f.key)}>\n            {f.label}\n          </button>\n        ))}\n      </div>\n\n      {filtered.length === 0 ? (\n        <div className=\"state-msg\">해당 상태의 현장이 없습니다</div>\n      ) : (\n        <div className=\"grid\">\n          {filtered.map(p => <ProjectCard key={p.id} project={p} onClick={() => props.onOpen(p.id)} />)}\n        </div>\n      )}\n    </div>\n  );\n}\n\n// =================== 현장 상세 뷰 ===================\nfunction ProjectDetailView(props) {\n  const [project, setProject] = useState(null);\n  const [issues, setIssues] = useState([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState(null);\n  const [activeImage, setActiveImage] = useState(0);\n\n  useEffect(() => {\n    if (!props.projectId) { setLoading(false); return; }\n    setLoading(true);\n    const found = props.projects.find(p => p.id === props.projectId) || null;\n    setProject(found);\n    fetchIssuesByProject(props.projectId)\n      .then(setIssues)\n      .catch(err => setError(err.message))\n      .finally(() => setLoading(false));\n  }, [props.projectId, props.projects]);\n\n  if (loading) return <Spinner />;\n  if (error) return <div className=\"state-msg error\">{error}</div>;\n  if (!project) {\n    return (\n      <div className=\"page\">\n        <div className=\"state-msg\">현장을 찾을 수 없습니다</div>\n        <div className=\"state-msg\"><button className=\"btn-primary\" onClick={props.onBack}>← 목록으로</button></div>\n      </div>\n    );\n  }\n\n  const heroImg = project.gallery[activeImage] || project.cover;\n\n  return (\n    <div className=\"page\">\n      <div className=\"section-head\">\n        <a onClick={props.onBack}>← 현장 목록으로</a>\n      </div>\n\n      <div className=\"detail-hero\">\n        {heroImg\n          ? <img src={heroImg} alt={project.name} />\n          : <div className=\"card-img-placeholder\">🏗️</div>}\n        <div className=\"detail-hero-overlay\">\n          <div className=\"detail-hero-title\">\n            <h1>{project.name}</h1>\n            <p>📍 {project.address || '주소 미정'}</p>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"detail-grid\">\n        <div>\n          <div className=\"info-card\">\n            <h3>📊 공정 진행률</h3>\n            <ProgressBar value={project.progress} />\n            <div className=\"info-row mt-1\">\n              <span className=\"info-label\">상태</span>\n              <span className=\"info-value\"><StatusBadge status={project.status} /></span>\n            </div>\n            <div className=\"info-row\"><span className=\"info-label\">착공일</span><span className=\"info-value\">{project.startDate || '미정'}</span></div>\n            <div className=\"info-row\"><span className=\"info-label\">준공예정일</span><span className=\"info-value\">{project.endDate || '미정'}</span></div>\n            <div className=\"info-row\"><span className=\"info-label\">시공규모</span><span className=\"info-value\">{project.scale || '미정'}</span></div>\n          </div>\n\n          {project.gallery.length > 0 && (\n            <div className=\"info-card\">\n              <h3>📸 현장 사진 ({project.gallery.length})</h3>\n              <div className=\"gallery\">\n                {project.gallery.map((src, i) => (\n                  <img key={i} src={src} alt={'사진 ' + (i + 1)} onClick={() => setActiveImage(i)} />\n                ))}\n              </div>\n            </div>\n          )}\n\n          <div className=\"info-card\">\n            <h3>🚨 이슈 ({issues.length})</h3>\n            {issues.length === 0 ? (\n              <div className=\"state-msg\">등록된 이슈가 없습니다</div>\n            ) : (\n              issues.map(iss => {\n                const cls = PRIORITY_CLASS[iss.priority] || 'priority-mid';\n                return (\n                  <div key={iss.id} className=\"issue-item\">\n                    <div className={'issue-priority ' + cls}></div>\n                    <div className=\"issue-body\">\n                      <div className=\"issue-name\">{iss.name}</div>\n                      <div className=\"issue-meta\">\n                        <span>우선순위: {iss.priority}</span>\n                        <span>·</span>\n                        <span>상태: {iss.status}</span>\n                        <span>·</span>\n                        <span>{iss.date}</span>\n                      </div>\n                      {iss.content && <div className=\"issue-content\">{iss.content}</div>}\n                    </div>\n                  </div>\n                );\n              })\n            )}\n          </div>\n        </div>\n\n        <div>\n          <div className=\"info-card\">\n            <h3>👷 담당자</h3>\n            <div className=\"info-row\"><span className=\"info-label\">담당소장</span><span className=\"info-value\">{project.manager || '미지정'}</span></div>\n            {project.managerPhone && (\n              <div className=\"info-row\"><span className=\"info-label\">연락처</span><span className=\"info-value\">{project.managerPhone}</span></div>\n            )}\n          </div>\n\n          <div className=\"info-card\">\n            <h3>💬 이 현장 문의하기</h3>\n            <p>하자 접수, 일정 문의 등은 문의 폼을 이용해주세요.</p>\n            <button className=\"btn-primary\" onClick={() => props.onNav('contact', { projectId: project.id })}>\n              문의하기 →\n            </button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n\n// =================== 문의 폼 뷰 ===================\nfunction ContactView(props) {\n  const [form, setForm] = useState({\n    name: '', email: '', phone: '',\n    relation: '건축주', type: '일반문의',\n    projectId: props.preselectedProjectId || '',\n    unit: '', occurredAt: '',\n    urgency: '보통', content: '',\n  });\n  const [status, setStatus] = useState('idle');\n  const [errorMsg, setErrorMsg] = useState('');\n\n  const update = (key, value) => setForm(prev => Object.assign({}, prev, { [key]: value }));\n\n  async function handleSubmit(e) {\n    e.preventDefault();\n    if (!form.name || !form.email || !form.phone || !form.content) {\n      setErrorMsg('필수 항목(*)을 모두 입력해주세요.');\n      setStatus('error');\n      return;\n    }\n    setStatus('submitting');\n    try {\n      await submitInquiry(form);\n      setStatus('success');\n      setForm({\n        name: '', email: '', phone: '',\n        relation: '건축주', type: '일반문의',\n        projectId: '', unit: '', occurredAt: '',\n        urgency: '보통', content: '',\n      });\n    } catch (err) {\n      setStatus('error');\n      setErrorMsg(err.message || '제출 중 오류가 발생했습니다.');\n    }\n  }\n\n  return (\n    <div className=\"page\">\n      <h1 className=\"page-title\">문의·하자 접수</h1>\n      <p className=\"page-subtitle\">제출하신 내용은 노션 DB에 자동 등록되며, 담당자가 확인 후 연락드립니다.</p>\n\n      <form className=\"form\" onSubmit={handleSubmit}>\n        {status === 'success' && (\n          <div className=\"form-success\">✅ 접수가 완료되었습니다. 빠른 시일 내에 회신드리겠습니다.</div>\n        )}\n        {status === 'error' && (\n          <div className=\"form-error\">⚠️ {errorMsg}</div>\n        )}\n\n        <div className=\"form-row\">\n          <div className=\"form-field\">\n            <label className=\"form-label\">이름<span className=\"required\">*</span></label>\n            <input className=\"form-input\" value={form.name} onChange={e => update('name', e.target.value)} />\n          </div>\n          <div className=\"form-field\">\n            <label className=\"form-label\">관계</label>\n            <select className=\"form-select\" value={form.relation} onChange={e => update('relation', e.target.value)}>\n              <option>건축주</option><option>입주자</option><option>협력사</option><option>기타</option>\n            </select>\n          </div>\n        </div>\n\n        <div className=\"form-row\">\n          <div className=\"form-field\">\n            <label className=\"form-label\">이메일<span className=\"required\">*</span></label>\n            <input type=\"email\" className=\"form-input\" value={form.email} onChange={e => update('email', e.target.value)} />\n          </div>\n          <div className=\"form-field\">\n            <label className=\"form-label\">전화번호<span className=\"required\">*</span></label>\n            <input className=\"form-input\" value={form.phone} onChange={e => update('phone', e.target.value)} placeholder=\"010-0000-0000\" />\n          </div>\n        </div>\n\n        <div className=\"form-row\">\n          <div className=\"form-field\">\n            <label className=\"form-label\">문의 유형<span className=\"required\">*</span></label>\n            <select className=\"form-select\" value={form.type} onChange={e => update('type', e.target.value)}>\n              <option>일반문의</option><option>하자접수</option><option>견적요청</option><option>기타</option>\n            </select>\n          </div>\n          <div className=\"form-field\">\n            <label className=\"form-label\">관련 현장</label>\n            <select className=\"form-select\" value={form.projectId} onChange={e => update('projectId', e.target.value)}>\n              <option value=\"\">선택 안 함</option>\n              {props.projects.map(p => (<option key={p.id} value={p.id}>{p.name}</option>))}\n            </select>\n          </div>\n        </div>\n\n        <div className=\"form-row\">\n          <div className=\"form-field\">\n            <label className=\"form-label\">동·호수</label>\n            <input className=\"form-input\" value={form.unit} onChange={e => update('unit', e.target.value)} placeholder=\"예: 101동 1502호\" />\n          </div>\n          <div className=\"form-field\">\n            <label c
